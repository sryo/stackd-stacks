<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script type="module">
  import { sd } from "sd://runtime/api.js";
  import { mountPointOf, swapInstallScript, appAt, serialized, shQuote } from "./logic.js";

  const DOWNLOADS = "~/Downloads";
  const SUPPORTED = {
    dmg: "image", iso: "image", cdr: "image", img: "image", sparseimage: "image",
    pkg: "package", mpkg: "package"
  };
  const PARTIAL_RE = /\.(part|download|crdownload)$/i;
  const STABILITY_CHECKS = 3;
  const DEBOUNCE_MS = 500;
  const PENDING_RESCAN_MS = 3000;
  const HANDLED_TTL_S = 86400;
  const GRACEFUL_QUIT_DEADLINE_MS = 3000;
  const GRACEFUL_QUIT_POLL_MS = 200;
  const POST_KILL_DELAY_MS = 300;

  const handledFiles = new Map();
  const fileStates = new Map();
  let cancelPendingRescan = null;
  let downloadsAbs = DOWNLOADS;

  function notify(body) { sd.notify.show({ title: "AutoDMG", body }); }

  function basename(p) { return p.split("/").pop() || p; }

  function appNameOf(appPath) { return (appPath.match(/([^/]+)\.app$/) || [])[1] || basename(appPath); }

  function fileTypeOf(name) {
    if (PARTIAL_RE.test(name)) return null;
    const m = name.match(/\.([^.]+)$/);
    return m ? (SUPPORTED[m[1].toLowerCase()] || null) : null;
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function logError(e) { console.error("autodmg:", e); }

  async function runAdminScript(shellCmd) {
    const script = 'do shell script "' + shellCmd.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '" with administrator privileges';
    const r = await sd.applescript.run(script);
    return !!(r && r.ok);
  }

  async function checkStable(filePath) {
    const stat = await sd.fs.stat(filePath);
    if (!stat) return false;
    const size = stat.size;
    const state = fileStates.get(filePath);
    if (!state) {
      fileStates.set(filePath, { size, checks: 0 });
      return false;
    }
    if (state.size === size) {
      state.checks += 1;
      if (state.checks >= STABILITY_CHECKS) return true;
    } else {
      state.size = size;
      state.checks = 0;
    }
    return false;
  }

  const scan = serialized(async () => {
    const names = await sd.fs.list(DOWNLOADS);
    if (!names) return;
    const nowS = Math.floor(Date.now() / 1000);
    let pending = false;

    for (const name of names) {
      const fType = fileTypeOf(name);
      if (!fType) continue;
      const fullPath = downloadsAbs + "/" + name;
      const stamp = handledFiles.get(fullPath);
      if (stamp && (nowS - stamp) > HANDLED_TTL_S) handledFiles.delete(fullPath);
      if (handledFiles.has(fullPath)) continue;

      if (await checkStable(fullPath)) {
        handledFiles.set(fullPath, nowS);
        fileStates.delete(fullPath);
        const install = fType === "image" ? openDiskImage(fullPath) : installPKG(fullPath, fullPath);
        install.catch(logError);
      } else {
        pending = true;
      }
    }

    if (pending) {
      if (cancelPendingRescan) cancelPendingRescan();
      cancelPendingRescan = sd.timer.timeout(() => { cancelPendingRescan = null; scan(); }, PENDING_RESCAN_MS);
    }
  }, logError);

  async function openDiskImage(imagePath) {
    notify("Mounting " + basename(imagePath));
    const r = await sd.proc.exec("/usr/bin/hdiutil", [
      "attach", imagePath, "-plist", "-nobrowse", "-noautoopen",
      "-noverify", "-ignorebadchecksums"
    ]);
    if (!r || r.code !== 0) {
      const err = (r && r.stderr) || "";
      if (/authentication|password/i.test(err)) {
        notify("Encrypted image — mount manually");
        handledFiles.delete(imagePath);
      } else {
        notify("Failed to mount " + basename(imagePath));
      }
      return;
    }
    const mountPoint = mountPointOf(r.stdout || "");
    if (!mountPoint) {
      notify("Mount failed (no path)");
      handledFiles.delete(imagePath);
      return;
    }
    let installed = false;
    try {
      installed = await installContents(mountPoint);
    } finally {
      if (installed) await cleanup(mountPoint, imagePath);
      else await detach(mountPoint);
    }
  }

  async function installContents(mountPoint) {
    const apps = await findFiles(mountPoint, "*.app");
    if (apps.length > 0) return pickAppAndInstall(apps);
    const pkgs = await findFiles(mountPoint, "*.pkg");
    if (pkgs.length > 0) return installPKG(pkgs[0], null);
    notify("Empty or unsupported image");
    return false;
  }

  async function findFiles(mountPoint, glob) {
    const r = await sd.proc.exec("/usr/bin/find", [mountPoint, "-name", glob, "-maxdepth", "1"]);
    if (!r || r.code !== 0 || !r.stdout) return [];
    return r.stdout.split("\n").map(s => s.trim()).filter(s => s.length > 0);
  }

  async function pickAppAndInstall(apps) {
    if (apps.length === 1) return copyAppToApplications(apps[0]);
    const items = apps.map((p, i) => ({ id: String(i), title: appNameOf(p) }));
    const pickedId = await sd.menu.popup(items);
    const chosen = pickedId == null ? null : apps[parseInt(pickedId, 10)];
    if (!chosen) {
      notify("No app chosen; unmounting");
      return false;
    }
    return copyAppToApplications(chosen);
  }

  async function copyAppToApplications(appLocation) {
    const appName = appNameOf(appLocation);
    const targetPath = "/Applications/" + appName + ".app";

    const running = appAt(sd.apps.running.value || [], targetPath);
    if (running && !(await promptAndQuit(appName, running.bundleId, targetPath))) {
      notify("Install cancelled for " + appName);
      return false;
    }
    return doInstall(appLocation, targetPath, appName);
  }

  async function promptAndQuit(appName, bundleId, targetPath) {
    const script =
      'display dialog "' + appName.replace(/"/g, '\\"') +
      ' is running. Quit it to replace with the new version?" ' +
      'with title "AutoDMG: Install update for ' + appName.replace(/"/g, '\\"') + '?" ' +
      'buttons {"Cancel", "Quit & Install"} default button "Quit & Install"';
    const r = await sd.applescript.run(script);
    if (!r || !r.ok) return false;
    if (!/Quit & Install/.test(r.result || "")) return false;
    await gracefulQuit(bundleId, targetPath);
    return true;
  }

  async function gracefulQuit(bundleId, targetPath) {
    if (!bundleId) return;
    await sd.apps.kill(bundleId, false);
    const deadline = Date.now() + GRACEFUL_QUIT_DEADLINE_MS;
    while (Date.now() < deadline) {
      await sleep(GRACEFUL_QUIT_POLL_MS);
      if (!appAt(sd.apps.running.value || [], targetPath)) return;
    }
    await sd.apps.kill(bundleId, true);
    await sleep(POST_KILL_DELAY_MS);
  }

  async function doInstall(appLocation, targetPath, appName) {
    const script = swapInstallScript(appLocation, targetPath);
    const r = await sd.proc.exec("/bin/sh", ["-c", script]);
    if (r && r.code === 0) {
      notify(appName + " installed");
      return true;
    }
    if (await runAdminScript(script)) {
      notify(appName + " installed (admin)");
      return true;
    }
    notify("Admin install cancelled");
    return false;
  }

  // `sourceFile` is set for a bare downloaded .pkg, which is cleaned up here;
  // a .pkg found inside a disk image is cleaned up with its image.
  async function installPKG(pkgPath, sourceFile) {
    notify("Installing " + basename(pkgPath));
    const ok = await runAdminScript("/usr/sbin/installer -pkg " + shQuote(pkgPath) + " -target /");
    if (!ok) {
      notify("PKG install cancelled");
      return false;
    }
    notify("PKG installed");
    if (sourceFile) await cleanup(null, sourceFile);
    return true;
  }

  async function detach(mountPoint) {
    const r = await sd.proc.exec("/usr/bin/hdiutil", ["detach", mountPoint, "-force"]);
    return !!(r && r.code === 0);
  }

  async function cleanup(mountPoint, sourceFile) {
    if (mountPoint && !(await detach(mountPoint))) {
      handledFiles.delete(sourceFile);
      notify("Couldn't unmount; will retry");
      return;
    }
    if (await sd.fs.delete(sourceFile)) {
      notify("Cleaned up " + basename(sourceFile));
    } else {
      await sd.proc.exec("/bin/rm", ["-f", sourceFile]);
    }
  }

  const s = await sd.fs.stat(DOWNLOADS);
  if (s && s.path) downloadsAbs = s.path;
  await sd.fs.watch(DOWNLOADS, sd.timer.debounce(scan, DEBOUNCE_MS));
  scan();
</script>
</body>
</html>
