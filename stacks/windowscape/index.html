<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WindowScape</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- The focused-window outline is drawn by the overlay-border stack
       (fed by our overlay-border.inclusion bang). Snapshot strips render in
       per-display sd.overlay.region panels (modules/snapshots.js). This
       click-through panel covers the primary display and only hosts the
       snapshot context menu; all input arrives through eventtaps. -->
  <script type="module" src="./modules/main.js"></script>
</body>
</html>
