<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="index.css">
  <title>Palette</title>
</head>
<body data-theme="dark">
  <!-- Body IS the palette. Daemon owns size, glass material, corner radius
       via manifest. Visibility is controlled by sd.window.invoke / dismiss.
       Logic lives in modules/ (main.js orchestrates; matcher.js is pure and
       node-tested in tests/). -->
  <div class="header">
    <span class="lead" id="lead"></span>
    <span id="nounchip" hidden></span>
    <input id="q" type="text" placeholder="Search…" autocomplete="off" spellcheck="false">
  </div>
  <div id="results" class="results"></div>
  <div class="footer">
    <div class="hints" id="hints"></div>
    <div class="primary" id="primary"></div>
  </div>
  <script type="module" src="modules/main.js"></script>
</body>
</html>
